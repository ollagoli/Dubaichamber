<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document View</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #323639;
      min-height: 100%;
    }
    #pages {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 16px 0;
    }
    canvas {
      max-width: 96%;
      height: auto;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.45);
      background: #fff;
    }
    #status {
      color: #e5e7eb;
      font-family: sans-serif;
      text-align: center;
      padding: 24px;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>
  <div id="status">Loading document...</div>
  <div id="pages"></div>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

    const params = new URLSearchParams(window.location.search);
    const tag = params.get("is_tag_required");

    // is_tag_required=2 -> certificates1.pdf, is_tag_required=1 -> certificates2.pdf
    const pdfUrl = tag === "2" ? "/certificates1.pdf" : "/certificates2.pdf";

    async function renderPdf() {
      const statusEl = document.getElementById("status");
      const pagesEl = document.getElementById("pages");
      try {
        const pdf = await pdfjsLib.getDocument(pdfUrl).promise;
        statusEl.style.display = "none";

        for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
          const page = await pdf.getPage(pageNum);
          const viewport = page.getViewport({ scale: 1.5 });
          const canvas = document.createElement("canvas");
          const context = canvas.getContext("2d");
          canvas.width = viewport.width;
          canvas.height = viewport.height;
          pagesEl.appendChild(canvas);
          await page.render({ canvasContext: context, viewport }).promise;
        }
      } catch (err) {
        statusEl.textContent = "Document could not be loaded.";
      }
    }

    renderPdf();
  </script>
</body>
</html>
