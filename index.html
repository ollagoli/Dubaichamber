<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document View</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #525659;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <iframe id="pdfViewer"></iframe>
  <script>
    const params = new URLSearchParams(window.location.search);
    const tag = params.get("is_tag_required");

    const file = tag === "2" ? "/certificates2.pdf" : "/certificates1.pdf";
    document.getElementById("pdfViewer").src = file;
  </script>
</body>
</html>
